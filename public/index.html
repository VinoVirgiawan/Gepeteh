<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheatGPT Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="d" id="app">
  <div class="hdr">
    <h1>&#x26A1; CheatGPT Dashboard</h1>
    <div class="ha">
      <span style="color:var(--t2);font-size:13px">&#x1F4B0; <span id="curD" style="color:var(--green);font-weight:700">999,999,999</span></span>
      <a href="/api/admin?do=logout" class="bs" style="text-decoration:none;color:var(--red);border-color:var(--red)">&#x1F6AA; Logout</a>
    </div>
  </div>
  <div class="st">
    <div class="sc"><div class="i">&#x1F511;</div><div class="v" id="tK">0</div><div class="l">Total Keys</div></div>
    <div class="sc"><div class="i">&#x2705;</div><div class="v" id="aK">0</div><div class="l">Active</div></div>
    <div class="sc"><div class="i">&#x1F4F1;</div><div class="v" id="tD">0</div><div class="l">Devices</div></div>
    <div class="sc"><div class="i">&#x1F4CA;</div><div class="v" id="tU">0</div><div class="l">Uses</div></div>
  </div>
  <div class="tb">
    <button class="tbb on" id="tabK" onclick="sw('keys')">&#x1F4CB; Keys</button>
    <button class="tbb" id="tabH" onclick="sw('history')">&#x1F4DA; History</button>
  </div>
  <div id="tabKeys" class="ks">
    <div class="kh"><h2>&#x1F4CB; License Keys</h2>
    <button class="bt bp" style="width:auto;padding:10px 20px;font-size:13px" onclick="openM('cM')">&#x2795; Create Key</button></div>
    <table><thead><tr><th>Key</th><th>Status</th><th>Expires</th><th>Devices</th><th>Uses</th><th>Actions</th></tr></thead>
    <tbody id="kB"></tbody></table>
    <div class="es" id="eS" style="display:none"><p>&#x1F4ED; No keys yet</p></div>
  </div>
  <div id="tabHistory" class="ks" style="display:none">
    <div class="kh"><h2>&#x1F4DA; History</h2></div>
    <div id="hL"></div>
    <div class="es" id="eH" style="display:none"><p>&#x1F4DA; No history</p></div>
  </div>
  <div class="mo" id="cM"><div class="md"><h3>&#x2728; Create Key</h3>
    <div class="fg"><label>Custom Key (empty=auto)</label><input type="text" id="cK" placeholder="CHEATGPT-PAYFURY-1DAY-XXXXXXXX"></div>
    <div class="fg"><label>&#x1F4C5; Days</label><input type="number" id="kD" value="1" min="1"></div>
    <div class="fg"><label>&#x1F4F1; Max Devices (0=unlimited)</label><input type="number" id="kM" value="1" min="0"></div>
    <div class="fg"><label>&#x1F4B0; Currency</label><input type="number" id="kC" value="999999999" min="0"></div>
    <div class="ma"><button class="bs" onclick="closeM('cM')">Cancel</button>
    <button class="bt bp" style="width:auto;padding:10px 24px;font-size:13px" onclick="doCreate()">&#x1F511; Create</button></div></div></div>
  <div class="mo" id="rM"><div class="md" style="max-width:460px"><h3>&#x1F4C3; Receipt</h3>
    <div class="rct" id="rCt"></div>
    <div class="ma"><button class="bs" onclick="closeM('rM')">Close</button>
    <button class="bt bp" style="width:auto;padding:10px 24px;font-size:13px" onclick="dlRct()">&#x1F4BE; Download</button></div></div></div>
  <div class="mo" id="eM"><div class="md"><h3>&#x270F;&#xFE0F; Edit Key</h3><input type="hidden" id="eKI">
    <div class="fg"><label>&#x1F4C5; Days</label><input type="number" id="eD" min="1"></div>
    <div class="fg"><label>&#x1F4F1; Max Devices</label><input type="number" id="eDV" min="1"></div>
    <div class="fg"><label>&#x1F4B0; Currency</label><input type="number" id="eC" min="0"></div>
    <div class="ma"><button class="bs" onclick="closeM('eM')">Cancel</button>
    <button class="bt bp" style="width:auto;padding:10px 24px;font-size:13px" onclick="doEdit()">&#x1F4BE; Save</button></div></div></div>
  <div class="mo" id="dM"><div class="md"><h3>&#x1F4F1; Devices</h3>
    <p style="color:var(--t2);font-size:13px;margin-bottom:16px" id="dKL"></p>
    <ul class="dl" id="dL"></ul>
    <div class="ma"><button class="bs" onclick="closeM('dM')">Close</button></div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
var KD=[],HD=[],lastRct=null;
function S(m,t){t=t||'success';var e=document.getElementById('toast');e.textContent=(t==='success'?'✅ ':'❌ ')+m;e.className='toast '+(t==='success'?'tss':'tse');e.style.display='block';setTimeout(function(){e.style.display='none'},3000)}
function openM(id){document.getElementById(id).classList.add('on')}
function closeM(id){document.getElementById(id).classList.remove('on')}
document.querySelectorAll('.mo').forEach(function(m){m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('on')})});
function sw(t){document.getElementById('tabKeys').style.display=t==='keys'?'block':'none';document.getElementById('tabHistory').style.display=t==='history'?'block':'none';document.getElementById('tabK').className=t==='keys'?'tbb on':'tbb';document.getElementById('tabH').className=t==='history'?'tbb on':'tbb';if(t==='history')loadH()}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function gS(k){if(!k.is_active)return'<span class="bd bi">⏸ Disabled</span>';if(k.days_left<=0)return'<span class="bd be">⏰ Expired</span>';return'<span class="bd ba">✅ Active ('+k.days_left+'d)</span>'}
function loadK(){fetch('/api/admin?action=list').then(function(r){return r.json()}).then(function(d){if(!d.ok)return;KD=d.keys;document.getElementById('curD').textContent=(d.settings&&d.settings.currency?d.settings.currency:999999999).toLocaleString();var t=d.keys.length,a=0,dev=0,uses=0;for(var i=0;i<t;i++){if(d.keys[i].is_active&&d.keys[i].days_left>0)a++;dev+=d.keys[i].device_count;uses+=d.keys[i].use_count}document.getElementById('tK').textContent=t;document.getElementById('aK').textContent=a;document.getElementById('tD').textContent=dev;document.getElementById('tU').textContent=uses;var tb=document.getElementById('kB'),em=document.getElementById('eS');if(t===0){tb.innerHTML='';em.style.display='block';return}em.style.display='none';var h='';for(var i=0;i<t;i++){var k=d.keys[i];h+='<tr style="animation:fade .3s ease"><td><span class="kt">'+esc(k.key)+'</span></td><td>'+gS(k)+'</td><td style="font-size:12px;color:var(--t2)">'+k.expires_human+'</td><td><span style="color:var(--a2);font-weight:600">'+k.device_count+'</span>/'+(k.max_devices===0?'∞':k.max_devices)+'</td><td>'+k.use_count+'</td><td><div class="ac"><button class="bs" data-a="dev" data-k="'+esc(k.key)+'">📱</button><button class="bs" data-a="edit" data-k="'+esc(k.key)+'">✏️</button><button class="bs" data-a="tog" data-k="'+esc(k.key)+'">'+(k.is_active?'⏸':'▶️')+'</button><button class="bdl" data-a="del" data-k="'+esc(k.key)+'">🗑</button></div></td></tr>'}tb.innerHTML=h;bindBtns()}).catch(function(e){console.error(e)})}
function bindBtns(){var btns=document.querySelectorAll('[data-a]');for(var i=0;i<btns.length;i++){btns[i].addEventListener('click',function(){var a=this.getAttribute('data-a'),k=this.getAttribute('data-k');if(a==='dev')viewDev(k);else if(a==='edit')editK(k);else if(a==='tog')togK(k);else if(a==='del')delK(k)})}}
function loadH(){fetch('/api/admin?action=history').then(function(r){return r.json()}).then(function(d){if(!d.ok)return;HD=d.history;var el=document.getElementById('hL'),em=document.getElementById('eH');if(!d.history||d.history.length===0){el.innerHTML='';em.style.display='block';return}em.style.display='none';var h='';for(var i=0;i<d.history.length;i++){var x=d.history[i];h+='<div class="hi"><div><div style="font-family:monospace;color:var(--a2);font-size:12px">'+esc(x.key)+'</div></div><div style="color:var(--t2);font-size:11px;margin-left:auto">'+x.days+'d | '+x.max_devices+' dev | 💰'+(x.currency||999999999).toLocaleString()+' | '+x.created_human+'</div></div>'}el.innerHTML=h}).catch(function(e){console.error(e)})}
function doCreate(){var bk=document.getElementById('cK').value.trim(),dy=parseInt(document.getElementById('kD').value),md=parseInt(document.getElementById('kM').value),cr=parseInt(document.getElementById('kC').value);fetch('/api/admin?action=create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({custom_key:bk,days:dy,max_devices:md,currency:cr})}).then(function(r){return r.json()}).then(function(d){if(d.ok){showRct(d);closeM('cM');loadK();S('Key created: '+d.key)}else S(d.error||'Failed','error')}).catch(function(e){console.error(e);S('Network error','error')})}
function showRct(d){lastRct=d;var now=new Date().toLocaleString();var h='<div class="rh"><h3>🔑 CheatGPT Key</h3><p>Payment Receipt</p></div>';h+='<div class="rr"><span class="rl">Key</span><span class="rv" style="font-family:monospace;font-size:11px">'+esc(d.key)+'</span></div>';h+='<div class="rr"><span class="rl">Duration</span><span class="rv">'+d.days+' Day(s)</span></div>';h+='<div class="rr"><span class="rl">Max Devices</span><span class="rv">'+(d.max_devices===0?'Unlimited':d.max_devices)+'</span></div>';h+='<div class="rr"><span class="rl">Currency</span><span class="rv">💰 '+(d.currency||999999999).toLocaleString()+'</span></div>';h+='<div class="rr"><span class="rl">Expires</span><span class="rv">'+d.expires_human+'</span></div>';h+='<div class="rr"><span class="rl">Created</span><span class="rv">'+now+'</span></div>';h+='<div class="rf">CheatGPT License Server</div>';document.getElementById('rCt').innerHTML=h;openM('rM')}
function dlRct(){if(!lastRct)return;var c=document.createElement('canvas');c.width=500;c.height=520;var x=c.getContext('2d');var g=x.createLinearGradient(0,0,500,520);g.addColorStop(0,'#0a0a1a');g.addColorStop(1,'#1a1a3e');x.fillStyle=g;x.fillRect(0,0,500,520);x.strokeStyle='#6c5ce7';x.lineWidth=3;x.strokeRect(10,10,480,500);x.setLineDash([8,4]);x.strokeStyle='rgba(108,92,231,.3)';x.beginPath();x.moveTo(30,140);x.lineTo(470,140);x.stroke();x.beginPath();x.moveTo(30,440);x.lineTo(470,440);x.stroke();x.setLineDash([]);x.fillStyle='#a29bfe';x.font='bold 24px system-ui';x.textAlign='center';x.fillText('CheatGPT Key',250,50);x.fillStyle='#888';x.font='12px system-ui';x.fillText('Payment Receipt',250,72);x.fillStyle='#6c5ce7';x.font='bold 14px monospace';x.fillText(lastRct.key,250,110);var rows=[['Duration',lastRct.days+' Day(s)'],['Max Devices',lastRct.max_devices===0?'Unlimited':String(lastRct.max_devices)],['Currency','💰 '+(lastRct.currency||999999999).toLocaleString()],['Expires',lastRct.expires_human],['Created',new Date().toLocaleString()]];var ry=170;for(var i=0;i<rows.length;i++){x.fillStyle='#888';x.font='13px system-ui';x.textAlign='left';x.fillText(rows[i][0],40,ry);x.fillStyle='#e0e0e0';x.font='bold 13px system-ui';x.textAlign='right';x.fillText(rows[i][1],460,ry);ry+=36}x.fillStyle='#555';x.font='11px system-ui';x.textAlign='center';x.fillText('CheatGPT License Server',250,470);var link=document.createElement('a');link.download='receipt-'+lastRct.key+'.png';link.href=c.toDataURL('image/png');link.click();S('Receipt downloaded!')}
function delK(key){if(!confirm('Delete: '+key+'?'))return;fetch('/api/admin?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}).then(function(r){return r.json()}).then(function(d){if(d.ok){S('Deleted');loadK()}else S(d.error,'error')})}
function togK(key){fetch('/api/admin?action=toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}).then(function(r){return r.json()}).then(function(d){if(d.ok){S(d.is_active?'Activated':'Disabled');loadK()}})}
function editK(key){var k=null;for(var i=0;i<KD.length;i++){if(KD[i].key===key){k=KD[i];break}}if(!k)return;document.getElementById('eKI').value=key;document.getElementById('eD').value=k.days_left||1;document.getElementById('eDV').value=k.max_devices||1;document.getElementById('eC').value=k.currency||999999999;openM('eM')}
function doEdit(){var key=document.getElementById('eKI').value;fetch('/api/admin?action=edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,days:parseInt(document.getElementById('eD').value),max_devices:parseInt(document.getElementById('eDV').value),currency:parseInt(document.getElementById('eC').value)})}).then(function(r){return r.json()}).then(function(d){if(d.ok){S('Updated');closeM('eM');loadK()}else S(d.error,'error')})}
function viewDev(key){document.getElementById('dKL').textContent='Key: '+key;fetch('/api/admin?action=devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}).then(function(r){return r.json()}).then(function(d){var l=document.getElementById('dL');if(!d.ok||!d.devices||Object.keys(d.devices).length===0){l.innerHTML='<li class="di">📭 No devices</li>'}else{var h='';var entries=Object.entries(d.devices);for(var i=0;i<entries.length;i++){var dev=entries[i][1];h+='<li class="di"><div><div style="font-weight:500">'+esc(dev.name||'Unknown')+'</div><div style="color:var(--t2);font-size:11px">First: '+new Date(dev.first_use*1000).toLocaleString()+'</div></div><span style="color:var(--t2);font-size:11px;margin-left:auto">Last: '+new Date(dev.last_use*1000).toLocaleString()+'</span></li>'}l.innerHTML=h}openM('dM')}).catch(function(e){console.error(e)})}
loadK();setInterval(loadK,30000);
</script>
</body>
</html>
